name: Build webOS package
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node parser.test.cjs && node app.test.cjs
      - run: node tools/check-publication.cjs
      - run: for script in app/scripts/*.sh; do bash -n "$script"; done
      - run: bash tools/test-diagnostics.sh
      - run: go test app/daemon-src/main.go app/daemon-src/subscription.go app/daemon-src/security_test.go app/daemon-src/subscription_test.go app/daemon-src/ipcheck_test.go
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags '-s -w' -o app/bin/xraytun-daemon app/daemon-src/main.go app/daemon-src/subscription.go
      - run: mkdir -p dist && npx --yes --package @webosose/ares-cli@2.4.0 ares-package -e daemon-src app -o dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webos-tun-1.3.0
          path: dist/*.ipk
